name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must track production. Every Home Assistant release this integration
          # supports (>= 2026.3.0) requires Python >= 3.14.2, and production runs
          # 3.14. On 3.13 pip silently capped
          # pytest-homeassistant-custom-component at 0.13.316 -- Home Assistant
          # 2026.2.3 -- so CI was testing six releases behind what we ship to.
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run pytest
        run: pytest tests/ -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Pin the linter. ruff-action installs the newest ruff by default, so
          # an unpinned job changes its own rule set whenever ruff ships a
          # release -- which is how this check went red with no code change.
          # Bump this deliberately, with the resulting fixes in the same commit.
          version: "0.16.3"
          args: check custom_components tests

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
