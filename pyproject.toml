[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# The oldest Home Assistant this integration supports (2026.3.0, per hacs.json)
# already requires Python >= 3.14.2, so 3.14 is the true minimum for our source.
target-version = "py314"

[tool.ruff.lint]
ignore = [
  # Home Assistant's Entity API declares _attr_* as ordinary assignable
  # attributes. Annotating our overrides as ClassVar to satisfy RUF012 would
  # conflict with those base-class declarations, and none of ours is ever
  # assigned per instance.
  "RUF012",
]
